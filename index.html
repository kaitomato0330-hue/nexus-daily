function svMm(id){const old=S.memos.find(x=>x.id==id),l=V_('f_l')=='1',b=V_('f_b'),o={title:V_('f_t').trim()||b.split('\n')[0].slice(0,20)||'無題',list:l,body:l?'':b,items:l?b.split('\n').filter(x=>x.trim()).map(t=>({t:t.trim(),d:!!old?.items?.find(x=>x.t==t.trim()&&x.d)})):[],folder:V_('f_f'),tags:V_('f_tg').split(/\s+/).filter(Boolean),pin:$('#f_pn').checked,img:FS.img,ts:Date.now()};if(id)Object.assign(old,o);else S.memos.push({id:uid(),...o});save();cm();go(V)}

function wEv(){const l=items(ds(new Date()));return`<div class="card"><h3>今日の予定<button class="chip" onclick="evForm('',ds(new Date()))">＋</button></h3>${l.length?l.map(evRow).join(''):'<div class="em">今日の予定はありません。下の入力欄から追加できます</div>'}</div>`}

const wPin=()=>{const l=S.memos.filter(m=>m.pin);return`<div class="card"><h3>ピン留めメモ</h3>${l.length?l.map(mmRow).join(''):'<div class="em">ピン留めしたメモがここに出ます</div>'}</div>`};
function hm(){const on=S.home.split(',');return`<div style="margin-bottom:10px">${[['ev','予定'],['todo','ToDo'],['pin','ピン留め']].map(([k,l])=>`<button class="chip ${on.includes(k)?'on':''}" onclick="hmT('${k}')">${l}</button>`).join('')}<button class="chip" onclick="S.home='todo';save();go('home')">ToDoのみ</button><button class="chip" onclick="S.home='ev,todo,pin';save();go('home')">全部</button></div>`+(on.includes('ev')?wEv():'')+(on.includes('todo')?wTd():'')+(on.includes('pin')?wPin():'')}

function cal(){const d=pd(sel),y=d.getFullYear(),mo=d.getMonth(),T=ds(new Date());let h=`<div class="fl" style="margin-bottom:8px"><button class="chip" onclick="sel=add(sel,${cv=='month'?-30:cv=='week'?-7:-1});go('cal')">◀</button><b>${y}年${mo+1}月${cv!='month'?d.getDate()+'日':''}</b><button class="chip" onclick="sel=add(sel,${cv=='month'?30:cv=='week'?7:1});go('cal')">▶</button></div><div>${[['month','月'],['week','週'],['day','日']].map(([k,l])=>`<button class="chip ${cv==k?'on':''}" onclick="cv='${k}';go('cal')">${l}</button>`).join('')}<button class="chip" onclick="sel=T_();go('cal')">今日</button></div><input type="text" placeholder="🔍 タイトル・メモ・場所・色で検索" value="${esc(q)}" oninput="q=this.value;clearTimeout(window.qt);window.qt=setTimeout(()=>go('cal',1),250)" id="cq" style="margin:6px 0 10px">`;
if(q){const Q=q.toLowerCase();const r=S.events.filter(e=>[e.title,e.memo,e.place,e.color,...(e.tags||[])].join(' ').toLowerCase().includes(Q)).sort((a,b)=>a.date.localeCompare(b.date));return h+`<div class="card">${r.length?r.map(e=>evRow({...e,ty:'e',tm:e.date.slice(5)+' '+(e.time||'')})).join(''):'<div class="em">見つかりません</div>'}</div>`}
if(cv=='month'){const f=new Date(y,mo,1),n=new Date(y,mo+1,0).getDate();h+='<div class="card"><div class="cal">'+[...W].map(x=>`<div class="h">${x}</div>`).join('')+'<div></div>'.repeat(f.getDay());for(let i=1;i<=n;i++){const s=y+'-'+pad(mo+1)+'-'+pad(i),it=items(s);h+=`<div class="${s==sel?'sl':''} ${s==T?'tdy':''}" onclick="sel='${s}';go('cal')">${i}<div class="dots">${it.slice(0,3).map(x=>`<u style="background:${s==sel?'var(--on)':x.color||'var(--ac)'}"></u>`).join('')}</div></div>`}h+='</div></div>'}
if(cv=='week'){const st=add(sel,-pd(sel).getDay());for(let i=0;i<7;i++){const s=add(st,i),it=items(s);h+=`<div class="card" ${s==T?'style="outline:2px solid var(--ac)"':''}><h3>${pd(s).getMonth()+1}/${pd(s).getDate()} (${W[i]})<button class="chip" onclick="evForm('','${s}')">＋</button></h3>${it.length?it.map(evRow).join(''):'<div class="em" style="padding:4px">—</div>'}</div>`}return h}
const it=items(sel);if(cv=='day'){h+=`<div class="card"><h3>${sel}<button class="chip" onclick="evForm('','${sel}')">＋</button></h3>`;for(let hr=0;hr<24;hr++){const r=it.filter(x=>x.tm&&+x.tm.slice(0,2)==hr);h+=`<div class="row" style="min-height:34px;align-items:flex-start"><span style="width:40px;color:var(--mu);font-size:12px">${pad(hr)}:00</span><div class="b">${r.map(evRow).join('')}</div></div>`}const ad=it.filter(x=>!x.tm);if(ad.length)h=h.replace('</h3>','</h3><div style="margin-bottom:8px">終日</div>'+ad.map(evRow).join('')+'<span></span>');return h+'</div>'}

const T_=()=>ds(new Date());
function todo(){const tags=[...new Set(S.todos.flatMap(t=>t.tags||[]))];let l=S.todos.filter(t=>!t.done&&(!tf||(t.tags||[]).includes(tf))).sort((a,b)=>ORD[a.pr]-ORD[b.pr]||(a.due||'9').localeCompare(b.due||'9'));const dn=S.todos.filter(t=>t.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)).slice(0,30);

let run=[],sw={on:false,st:0,el:0,laps:[]};const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return(s>=3600?Math.floor(s/3600)+':':'')+pad(Math.floor(s%3600/60))+':'+pad(s%60)};
const fsw=ms=>pad(Math.floor(ms/6e4))+':'+pad(Math.floor(ms/1e3)%60)+'.'+pad(Math.floor(ms/10)%100);
const PRE=[1,3,5,10,15,25,30,60];
function startT(sec,title,snd){run.push({id:uid(),end:Date.now()+sec*1e3,title:title||fmt(sec*1e3)+' タイマー',snd:snd||'chime',sec});if(Notification.permission=='default')askPerm();sv_run();go('timer')}
const sv_run=()=>{S.run=run;save()},stopT=id=>{run=run.filter(r=>r.id!=id);sv_run();go('timer')};
function mtForm(){om(`<h2>マイタイマーを登録</h2><label>タイトル</label><input type="text" id="f_t" placeholder="例：カップ麺"><label>時間（分・秒）</label><div class="fl"><input type="number" id="f_m" placeholder="分" value="3"><input type="number" id="f_s" placeholder="秒" value="0"></div><label>アラーム音</label><select id="f_a"><option value="chime">チャイム</option><option value="beep">ビープ</option><option value="alarm">アラーム</option><option value="soft">やさしい音</option></select><button class="btn g" style="margin-top:8px" onclick="beep($('#f_a').value)">▶ 試聴</button><div class="fl" style="margin-top:18px"><button class="btn g" onclick="cm()">閉じる</button><button class="btn" onclick="S.mt.push({id:uid(),title:V_('f_t')||'マイタイマー',sec:+V_('f_m')*60+ +V_('f_s'),snd:V_('f_a')});save();cm();go('timer')">保存</button></div>`)}
function timer(){return`<h2 style="margin-bottom:8px">タイマー</h2><div class="card"><h3>進行中 ${run.length}件</h3><div id="rl">${run.length?run.map(r=>`<div class="row"><div class="b"><b>${esc(r.title)}</b></div><span class="big" style="font-size:28px" data-e="${r.end}">${fmt(r.end-Date.now())}</span><button class="chip" onclick="stopT('${r.id}')">停止</button></div>`).join(''):'<div class="em">タイマーは動いていません</div>'}</div></div><div class="card"><h3>プリセット</h3>${PRE.map(m=>`<button class="chip" onclick="startT(${m*60})">${m}分</button>`).join('')}</div><div class="card"><h3>マイタイマー<button class="chip" onclick="mtForm()">＋登録</button></h3>${S.mt.length?S.mt.map(t=>`<div class="row"><div class="b" onclick="startT(${t.sec},'${esc(t.title)}','${t.snd}')"><b>▶ ${esc(t.title)}</b><i>${fmt(t.sec*1e3)}</i></div><button class="chip" onclick="S.mt=S.mt.filter(x=>x.id!='${t.id}');save();go('timer')">削除</button></div>`).join(''):'<div class="em">好きな時間と音で登録できます</div>'}</div><div class="card"><h3>ストップウォッチ</h3><div class="big" id="swd" style="text-align:center;margin:6px 0 12px">${fsw(swT())}</div><div class="fl" style="justify-content:center"><button class="btn" onclick="swGo()">${sw.on?'ストップ':'スタート'}</button><button class="btn g" onclick="swLap()">ラップ</button><button class="btn g" onclick="sw={on:false,st:0,el:0,laps:[]};go('timer')">リセット</button></div>${sw.laps.map((l,i)=>`<div class="row"><b>ラップ ${sw.laps.length-i}</b><span style="margin-left:auto">${fsw(l.d)}</span><span style="color:var(--mu)">${fsw(l.t)}</span></div>`).join('')}</div>`}
const swT=()=>sw.on?sw.el+Date.now()-sw.st:sw.el;
const swGo=()=>{if(sw.on){sw.el+=Date.now()-sw.st;sw.on=false}else{sw.st=Date.now();sw.on=true}go('timer')},swLap=()=>{if(!sw.on)return;const t=swT(),p=sw.laps[0]?.t||0;sw.laps.unshift({t,d:t-p});go('timer')};
setInterval(()=>{if(V=='timer'){document.querySelectorAll('[data-e]').forEach(e=>e.textContent=fmt(+e.dataset.e-Date.now()));const d=$('#swd');if(d)d.textContent=fsw(swT())}const dn=run.filter(r=>r.end<=Date.now());if(dn.length){run=run.filter(r=>r.end>Date.now());sv_run();dn.forEach(r=>{notify('⏱ タイマー終了',r.title,r.id);beep(r.snd);setTimeout(()=>beep(r.snd),1500)});if(V=='timer')go('timer')}},250);setInterval(chk,20000);
// memo
const mmRow=m=>`<div class="row" style="align-items:flex-start"><div class="b" onclick="mmForm('${m.id}')"><b>${m.pin?'📌 ':''}${esc(m.title)}</b><i>${esc(m.folder||'')} ${(m.tags||[]).map(x=>`<span class="tag">#${esc(x)}</span>`).join('')}</i>${m.list?(m.items||[]).map((it,i)=>`<div style="margin-top:3px" onclick="event.stopPropagation();mci('${m.id}',${i})">${it.d?'☑':'☐'} <span style="${it.d?'text-decoration:line-through;opacity:.5':''}">${esc(it.t)}</span></div>`).join(''):`<div style="font-size:13px;color:var(--mu);white-space:pre-wrap">${esc((m.body||'').slice(0,120))}</div>`}${m.img?`<img class="th" src="${m.img}">`:''}</div><button class="chip" onclick="pinT('${m.id}')">${m.pin?'解除':'📌'}</button></div>`;
const pinT=id=>{const m=S.memos.find(x=>x.id==id);m.pin=!m.pin;save();go(V)};
function memo(){const Q=mq.toLowerCase();let l=S.memos.filter(m=>(!mf||mf=='*'||m.folder==mf)&&(!Q||[m.title,m.body,...(m.tags||[]),...(m.items||[]).map(i=>i.t)].join(' ').toLowerCase().includes(Q))).sort((a,b)=>(b.pin-a.pin)||b.ts-a.ts);
return`<div class="fl" style="margin-bottom:8px"><h2>メモ</h2><button class="btn" onclick="mmForm()">＋ 追加</button></div><input type="text" id="mqi" placeholder="🔍 キーワード・タグで検索" value="${esc(mq)}" oninput="mq=this.value;clearTimeout(window.qt);window.qt=setTimeout(()=>go('memo',2),250)" style="margin-bottom:8px"><div><button class="chip ${!mf||mf=='*'?'on':''}" onclick="mf='*';go('memo')">すべて</button>${S.folders.map(f=>`<button class="chip ${mf==f?'on':''}" onclick="mf='${esc(f)}';go('memo')">📁 ${esc(f)}</button>`).join('')}<button class="chip" onclick="const n=prompt('フォルダ名');if(n&&!S.folders.includes(n)){S.folders.push(n);save();go('memo')}">＋</button>${mf&&mf!='*'&&mf!='未分類'?`<button class="chip" onclick="if(confirm('フォルダを削除（メモは未分類へ）')){S.memos.forEach(m=>{if(m.folder=='${esc(mf)}')m.folder='未分類'});S.folders=S.folders.filter(x=>x!='${esc(mf)}');mf='';save();go('memo')}">🗑</button>`:''}</div><div class="card">${l.length?l.map(mmRow).join(''):'<div class="em">メモがありません</div>'}</div>`}
// settings
const TH=[['dark','モダンダーク'],['light','クリーンライト'],['neon','サイバーネオン'],['rpg','RPGステータス'],['pop','パステルポップ'],['wa','和モダン'],['mono','ミニマルモノクロ'],['ocean','オーシャンブルー']];
const rs=()=>go('set');
function sett(){const np='Notification'in window?Notification.permission:'非対応';return`<div class="fl" style="margin-bottom:8px"><h2>アカウント・設定</h2><button class="btn g" onclick="go('home')">閉じる</button></div><div class="card"><h3>プロフィール</h3><div class="fl"><div class="av" style="background-image:${S.icon?`url(${S.icon})`:'none'}">${S.icon?'':esc(S.name[0])}</div><label class="chip">画像を変更<input type="file" accept="image/*" hidden onchange="pickImg(this,x=>{S.icon=x;save();hd();rs()})"></label></div><label style="font-size:12px;color:var(--mu)">ユーザー名／アプリ名</label><input type="text" value="${esc(S.name)}" onchange="S.name=this.value||'NEXUS DAILY';save();hd()"></div><div class="card"><h3>テーマ</h3>${TH.map(([k,l])=>`<button class="chip ${S.theme==k?'on':''}" onclick="S.theme='${k}';save();ap();rs()">${l}</button>`).join('')}</div><div class="card"><h3>通知（状態：${np}）</h3><button class="btn" onclick="askPerm(true)">通知を有効にする（テスト送信）</button><label style="display:block;font-size:12px;color:var(--mu);margin:12px 0 4px">デフォルト通知タイミング</label><select onchange="S.dn=this.value===''?null:+this.value;save()">${nOpt(S.dn)}</select></div><div class="card"><h3>外部AI連携（任意）</h3><select onchange="S.prov=this.value;save()"><option value="openai" ${S.prov=='openai'?'selected':''}>OpenAI</option><option value="gemini" ${S.prov=='gemini'?'selected':''}>Gemini</option></select><input type="password" placeholder="APIキー（未入力なら内蔵パーサー）" value="${esc(S.key)}" onchange="S.key=this.value.trim();save()" style="margin-top:8px"><div style="font-size:12px;color:var(--mu);margin-top:6px">キーはこの端末内にのみ保存されます</div></div><div class="card"><h3>データ</h3><button class="btn" onclick="exp()">書き出し（JSON）</button> <label class="btn g" style="display:inline-block">読み込み<input type="file" accept=".json" hidden onchange="imp(this)"></label></div>`}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='nexus-backup-'+T_()+'.json';a.click()}
function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!confirm('現在のデータを置き換えます。よろしいですか？'))return;S=d;save();ap();hd();go('home');toast('復元しました')}catch(e){toast('読み込めないファイルです')}};r.readAsText(f)}
// shell
const ap=()=>{document.documentElement.dataset.t=S.theme;document.querySelector('meta[name=theme-color]').content=getComputedStyle(document.body).getPropertyValue('--bg')||'#14161c'};
function hd(){const d=new Date();$('#hd').innerHTML=`<div><div class="yr">${d.getFullYear()}</div><div class="dt">${d.getMonth()+1}月${d.getDate()}日 <small>(${W[d.getDay()]})</small></div><div class="td">🗓 ${esc(todayInfo(d))}</div></div><div class="av" onclick="go('set')" style="background-image:${S.icon?`url(${S.icon})`:'none'}">${S.icon?'':esc(S.name[0])}</div>`}
const NV=[['home','🏠','ホーム'],['cal','📅','予定'],['todo','✅','ToDo'],['timer','⏱','タイマー'],['memo','📝','メモ']];
function go(v,keep){V=v;const m=$('#v'),st=m.scrollTop;m.innerHTML={home:hm,cal,todo,timer,memo,set:sett}[v]();$('#nv').innerHTML=NV.map(([k,i,l])=>`<button class="${k==v?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('');$('#hd').style.display=v=='home'?'flex':'none';if(keep||v==V&&st)m.scrollTop=st;if(keep==1){const e=$('#cq');e.focus();e.setSelectionRange(99,99)}if(keep==2){const e=$('#mqi');e.focus();e.setSelectionRange(99,99)}}
ap();hd();pmR();run=(S.run||[]).filter(r=>r.end>Date.now());go('home');ensureReg();setTimeout(chk,1500);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){hd();chk()}});
</script></body></html>
